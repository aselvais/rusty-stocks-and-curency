[package]
name = "stock_currency_tracker"
version = "1.0.0"
edition = "2021"
description = "Desktop app to track stocks and currencies, compare assets, and perform historical currency conversions."
license = "MIT"
readme = "README.md"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_plot = "0.29"

# Database (bundled SQLite, no system dependency)
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client (blocking keeps the eframe integration simple)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Error handling + logging
anyhow = "1"
thiserror = "1"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

